name: Build Vaultwarden musl

on:
  schedule:
    # Poll upstream every 30 minutes. A release is only built once it is
    # at least COOLDOWN_SECONDS old (see below).
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build. Empty = latest upstream release (1h cooldown applies). Set = build it now, no cooldown."
        required: false
        default: ""
      force:
        description: "Rebuild and overwrite assets even if the release already exists"
        type: boolean
        default: false

permissions:
  contents: read

# Builds take a long time. Without this, a scheduled run could start a second
# build for the same version while the first one is still running.
concurrency:
  group: vaultwarden-musl
  cancel-in-progress: false

env:
  UPSTREAM_REPO: dani-garcia/vaultwarden
  COOLDOWN_SECONDS: "3600" # wait 1 hour after upstream publishes

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Decide whether to build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            # Manual run with an explicit tag: skip the cooldown
            upstream_tag="$INPUT_VERSION"
            echo "Manual run for tag $upstream_tag (cooldown skipped)"
          else
            # /releases/latest ignores drafts and pre-releases
            release=$(gh api "repos/$UPSTREAM_REPO/releases/latest")
            upstream_tag=$(jq -r .tag_name <<<"$release")
            published_at=$(jq -r .published_at <<<"$release")
            age=$(( $(date +%s) - $(date -d "$published_at" +%s) ))
            echo "Latest upstream: $upstream_tag (published $published_at, ${age}s ago)"

            if [ "$age" -lt "$COOLDOWN_SECONDS" ]; then
              echo "Younger than the ${COOLDOWN_SECONDS}s cooldown; a later run will pick it up."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          version="${upstream_tag#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected version format: $version"
            exit 1
          fi

          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && [ "${INPUT_FORCE:-false}" != "true" ]; then
            echo "Release v$version already exists; nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_build=true"
            echo "upstream_tag=$upstream_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} (musl)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout upstream Vaultwarden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.upstream_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Bake alpine (musl) binary
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_VERSION: ${{ needs.check.outputs.upstream_tag }}
          SOURCE_REPOSITORY_URL: https://github.com/dani-garcia/vaultwarden
        with:
          pull: true
          source: .
          files: docker/docker-bake.hcl
          targets: alpine-multi
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.output=type=local,dest=./output

      - name: Verify and rename
        run: |
          file ./output/vaultwarden
          ldd ./output/vaultwarden || true
          mv ./output/vaultwarden vaultwarden-${{ matrix.arch }}-musl
          chmod +x vaultwarden-${{ matrix.arch }}-musl

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaultwarden-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}-musl
          path: vaultwarden-${{ matrix.arch }}-musl

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and tag
      actions: read # download this run's artifacts via gh
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
    steps:
      - name: Download build artifacts
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Prepare assets
        run: |
          set -euo pipefail
          mkdir release
          find dist -type f -name 'vaultwarden-*-musl' -exec mv {} release/ \;
          cd release
          test "$(ls vaultwarden-*-musl | wc -l)" -eq 2
          sha256sum vaultwarden-*-musl > SHA256SUMS
          ls -l

      - name: Create or update release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="Unofficial musl build (linux amd64 and arm64) of upstream Vaultwarden ${VERSION}: https://github.com/${UPSTREAM_REPO}/releases/tag/${UPSTREAM_TAG} - verify downloads with SHA256SUMS."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "$notes"
          fi
