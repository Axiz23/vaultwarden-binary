name: Build Vaultwarden musl

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Vaultwarden tag to build (upstream)"
        required: true
        default: "1.37.4"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} (musl)
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout upstream Vaultwarden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dani-garcia/vaultwarden
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Bake alpine (musl) binary
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_VERSION: ${{ inputs.version }}
          SOURCE_REPOSITORY_URL: https://github.com/dani-garcia/vaultwarden
        with:
          pull: true
          source: .
          files: docker/docker-bake.hcl
          targets: alpine-multi
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.output=type=local,dest=./output

      - name: Verify and rename
        run: |
          file ./output/vaultwarden
          ldd ./output/vaultwarden || true
          mv ./output/vaultwarden vaultwarden-${{ matrix.arch }}-musl
          chmod +x vaultwarden-${{ matrix.arch }}-musl

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaultwarden-${{ inputs.version }}-linux-${{ matrix.arch }}-musl
          path: vaultwarden-${{ matrix.arch }}-musl
